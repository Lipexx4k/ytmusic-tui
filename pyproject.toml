[project]
name = "ytmusic-tui"
version = "0.1.1"
description = "Cliente TUI minimalista e rápido para YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Eeyore"}]
keywords = ["youtube-music", "tui", "music-player", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.52.0",
    "ytmusicapi>=1.8.0",
    "python-mpv>=0.12.0",
    "yt-dlp>=2024.1.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/Lipexx4k/ytmusic-tui"
Repository = "https://github.com/Lipexx4k/ytmusic-tui"
Issues = "https://github.com/Lipexx4k/ytmusic-tui/issues"

[project.scripts]
ytmusic-tui = "ytmusic_tui.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201", "T203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["ytmusic_tui"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Bibliotecas de terceiros sem stubs/py.typed: o mypy não consegue analisar
# `mpv` (python-mpv) nem `yt_dlp`; o uso de ambas é encapsulado em
# `player/` e `download/`.
[[tool.mypy.overrides]]
module = ["mpv", "yt_dlp"]
ignore_missing_imports = true

# Dívida conhecida (planejada em T05 do plano de engenharia): os modelos usam
# `Column[...]` clássico e o mypy — sem o plugin do SQLAlchemy, removido no
# 2.1 — enxerga atributos de instância como `Column[...]` em vez do valor
# real. Os códigos abaixo são suprimidos só no serviço da biblioteca, que
# manipula instâncias ORM; o restante do código segue checado de verdade.
[[tool.mypy.overrides]]
module = ["ytmusic_tui.library.service"]
disable_error_code = ["assignment", "return-value", "arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: testes que tocam a rede de verdade (rode com YTMUSIC_INTEGRATION=1)",
]

[tool.setuptools.packages.find]
where = ["src"]