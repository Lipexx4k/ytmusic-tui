name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # A libmpv é carregada no import de `mpv` (python-mpv), e o
      # ctypes.util.find_library procura tanto `libmpv.so.2` quanto o link
      # `libmpv.so`. No Ubuntu 24.04 o pacote `mpv` traz só o .so.2 e o
      # find_library falha; o `libmpv-dev` fornece o link não-versionado.
      - name: Dependências de sistema (mpv + libmpv + ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y mpv libmpv-dev ffmpeg

      - name: Instalar o app (com dependências de dev)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Formatação (ruff format)
        run: ruff format --check src/ tests/

      - name: Tipagem (mypy)
        run: mypy src/

      - name: Testes (offline, com mocks)
        run: python -m pytest tests/ -q

  seguranca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar o app (com dependências de dev)
        run: pip install -e ".[dev]"

      # --skip-editable: o pacote local não está no PyPI e não é auditável;
      # o alvo são as dependências (runtime e dev).
      - name: Vulnerabilidades conhecidas (pip-audit)
        run: pip-audit --skip-editable

  # Verifica que o artefato publicável (sdist + wheel) instala e importa em
  # um ambiente limpo — é o que o `pip install` do usuário final executa.
  pacote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Dependências de sistema (mpv + libmpv)
        run: sudo apt-get update && sudo apt-get install -y mpv libmpv-dev

      - name: Build (sdist + wheel)
        run: |
          pip install build
          python -m build

      # T06.1: o `app.tcss` é runtime de verdade (sem ele o Textual morre no
      # startup com StylesheetError) e não era empacotado — o import sozinho
      # não pega isso, então o CONTEÚDO do artefato é conferido antes de
      # instalar. Este é o gate que faltava.
      - name: Conferir conteúdo do pacote (app.tcss no wheel e no sdist)
        run: |
          unzip -l dist/*.whl | grep -q 'ytmusic_tui/tui/app.tcss'
          tar tzf dist/*.tar.gz | grep -q 'ytmusic_tui/tui/app.tcss'

      - name: Instalar o wheel em ambiente limpo
        run: |
          python -m venv /tmp/venv-pacote
          /tmp/venv-pacote/bin/pip install dist/*.whl

      - name: Smoke test (import do app + CSS instalado + console script)
        run: |
          /tmp/venv-pacote/bin/python -c "import ytmusic_tui, ytmusic_tui.main, ytmusic_tui.tui.app; print('import ok')"
          /tmp/venv-pacote/bin/python -c "import importlib.resources as res; assert res.files('ytmusic_tui.tui').joinpath('app.tcss').is_file(), 'app.tcss ausente na instalação'; print('css ok')"
          test -x /tmp/venv-pacote/bin/ytmusic-tui
